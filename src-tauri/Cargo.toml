[package]
name = "noteplus"
version = "0.1.1"
description = "NotePlus+ - A powerful Notepad++ style code editor for macOS"
authors = ["NotePlus+"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "noteplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
