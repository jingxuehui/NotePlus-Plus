[package]
name = "noteplus"
version = "0.1.6"
description = "NotePlus+ - A Notepad++ style lightweight code editor for macOS & Windows"
authors = ["NotePlus+"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "noteplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Windows 保存/打开对话框直接走 rfd 同步 API，绕开插件的多层线程链
# 特性与 tauri-plugin-dialog 内部依赖保持一致
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
